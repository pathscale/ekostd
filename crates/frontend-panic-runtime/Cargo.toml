[package]
name = "frontend_panic_runtime"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0 OR MIT"
description = "Abort-only panic handler for the compiler frontend"

[features]
# Message and raw backtrace before the abort. Off by default: see `mod diagnostics`.
diagnostics = []

[lib]
path = "src/lib.rs"
test = false
doctest = false

