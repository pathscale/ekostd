# HARD RULE: rustc builds everything here against an EMPTY sysroot. rustc supplies no core, no alloc and no std.
# HARD RULE: no unwinding. Every unit is compiled with panic=abort. Do not turn unwinding back on anywhere.
# core, alloc and compiler_builtins come from bootstrap/ only. Do not remove, override or work around this.
[build]
rustflags = ["--sysroot", "/Users/revenge/code/ekostd/sysroot-empty", "-Cpanic=abort"]
